name: Upgrade WOF V4.5
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v450.py'
      - '.github/workflows/upgrade-v450.yml'
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.5
        run: |
          python3 tools/patch_v450.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.5" wof_v4_install_once.js
          grep -q "WOF V4.5 双层Z几何观战版启动" wof_v4_install_once.js
          grep -q "fallbackZActionCore:16" wof_v4_install_once.js
          grep -q "WATCH-Z壳" wof_v4_install_once.js
          echo "V4.5 bytes: $(wc -c < wof_v4_install_once.js)"
          sha256sum wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade WOF V4.5 dual Z geometry"
          git push
