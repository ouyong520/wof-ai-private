name: Upgrade WOF V4.11.1

on:
  push:
    paths:
      - 'tools/patch_v4111.py'
      - '.github/workflows/upgrade-v4111.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.11.1
        run: |
          python tools/patch_v4111.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.11.1" wof_v4_install_once.js
          grep -q "nonEnemyDamage" wof_v4_install_once.js
          grep -q "warningSources" wof_v4_install_once.js
      - name: Commit runtime
        run: |
          if git diff --quiet -- wof_v4_install_once.js; then
            echo "No runtime changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git commit -m "Upgrade runtime to V4.11.1"
          git push
