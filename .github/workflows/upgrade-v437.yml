name: Upgrade WOF V4.3.7
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v437.py'
      - '.github/workflows/upgrade-v437.yml'
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.3.7
        run: |
          python3 tools/patch_v437.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-p123-v4.3.7" wof_v4_install_once.js
          grep -q "WOF V4.3.7 全玩家观战预测版启动" wof_v4_install_once.js
          grep -q "观战模式：同时预测/审计 RAM 中存在的 P1/P2/P3" wof_v4_install_once.js
          echo "V4.3.7 bytes: $(wc -c < wof_v4_install_once.js)"
          sha256sum wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade WOF V4.3.7 spectator all players"
          git push
