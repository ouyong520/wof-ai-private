name: Upgrade WOF V4.8
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v480.py'
      - '.github/workflows/upgrade-v480.yml'
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.8
        run: |
          python3 tools/patch_v480.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.8" wof_v4_install_once.js
          grep -q "WOF V4.8 上下文Variant校准观战版启动" wof_v4_install_once.js
          grep -q "CAL_VARIANT" wof_v4_install_once.js
          grep -q "exportCalibration" wof_v4_install_once.js
          grep -q "variantDemoteConfirmed:3" wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade WOF V4.8 context variant calibration"
          git push
