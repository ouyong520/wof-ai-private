name: Upgrade WOF V4.5.1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v451.py'
      - '.github/workflows/upgrade-v451.yml'
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.5.1
        run: |
          python3 tools/patch_v451.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.5.1" wof_v4_install_once.js
          grep -q "WOF V4.5.1 静态报告观战版启动" wof_v4_install_once.js
          grep -q "report(){const t=reportText()" wof_v4_install_once.js
          grep -q "quiet(on=true)" wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade WOF V4.5.1 frozen reports"
          git push
