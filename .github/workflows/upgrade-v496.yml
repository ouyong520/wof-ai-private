name: Upgrade WOF V4.9.6

on:
  push:
    paths:
      - 'tools/patch_v496.py'
      - '.github/workflows/upgrade-v496.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.9.6
        run: |
          python3 tools/patch_v496.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.9.6" wof_v4_install_once.js
          grep -q "WOF V4.9.6 先观察后行动/漏判护栏版启动" wof_v4_install_once.js
          grep -q "active-needs-2-hits" wof_v4_install_once.js
          grep -q "watchPromoted" wof_v4_install_once.js
          grep -q "missTop" wof_v4_install_once.js
          echo "V4.9.6 bytes: $(wc -c < wof_v4_install_once.js)"
          sha256sum wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade runtime to V4.9.6"
          git push
