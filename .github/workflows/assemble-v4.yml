name: Assemble WOF V4.2.2
on:
  workflow_dispatch:
  push:
    paths:
      - 'wof_v4_parts/**'
      - '.github/workflows/assemble-v4.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and patch V4.2.2
        run: |
          cat wof_v4_parts/part01.txt \
              wof_v4_parts/part02.txt \
              wof_v4_parts/part03.txt \
              wof_v4_parts/part04.txt \
              wof_v4_parts/part05.txt \
              wof_v4_parts/part06.txt \
              wof_v4_parts/part07.txt \
              wof_v4_parts/part08.txt \
              wof_v4_parts/part09.txt \
              wof_v4_parts/part10.txt > wof_v4_install_once.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wof_v4_install_once.js')
          s=p.read_text(encoding='utf-8')

          # V4.2.x observer parameters.
          s=s.replace("cumulativeProbability:0.95,", "cumulativeProbability:0.95,\n    routeCommitMs:250,\n    abRouteSlackMs:120,", 1)

          # Unknown active-family fallback is advisory only.
          s=s.replace("slot:o.slot,type:o.type,family:null,confidence:.35,source:'active-unknown'});","slot:o.slot,type:o.type,family:null,confidence:.20,source:'active-unknown'});",1)

          # V4.2.2 decision: known-family actions only, plus a rolling route window.
          # A route does NOT need to remain collision-free for the whole 1000ms horizon;
          # it only needs to clear the imminent threat and remain safe for routeCommitMs.
          a=s.index("  function decision(p,danger){")
          b=s.index("  const ST={P1:{k:'',n:0,v:null}",a)
          decision="""  function decision(p,danger){
            const knownDanger=danger.filter(d=>d.source!=='active-unknown');
            const fullCur=evalPath(p,'CONTINUE',danger,0);
            const cur=evalPath(p,'CONTINUE',knownDanger,0);

            // No known-family collision: unknown active fallback may warn only.
            if(cur.safe){
              if(!fullCur.safe&&fullCur.hit?.source==='active-unknown')
                return{danger:true,watchOnly:true,best:'WATCH',hitMs:fullCur.collisionMs,hit:fullCur.hit,stay:fullCur};
              return{danger:false,best:'CONTINUE',stay:cur};
            }

            // Rolling horizon: solve the imminent escape, then re-plan on the next 40ms tick.
            const routeUntil=Math.min(CFG.horizonMs,cur.collisionMs+CFG.routeCommitMs);
            const routeDanger=knownDanger.filter(d=>d.t<=routeUntil);
            const up0=evalPath(p,'UP',routeDanger,0),down0=evalPath(p,'DOWN',routeDanger,0);
            const up=up0.safe?latestSafe(p,'UP',routeDanger,cur.collisionMs):-1;
            const down=down0.safe?latestSafe(p,'DOWN',routeDanger,cur.collisionMs):-1;

            if(up<0&&down<0){
              const known=h=>!!h&&h.family!=null&&h.source!=='active-unknown';
              const blockersKnown=known(cur.hit)&&known(up0.hit)&&known(down0.hit);
              // AB is only credible if both escape routes are blocked almost as soon as CONTINUE.
              const upNear=up0.collisionMs!=null&&up0.collisionMs<=cur.collisionMs+CFG.abRouteSlackMs;
              const downNear=down0.collisionMs!=null&&down0.collisionMs<=cur.collisionMs+CFG.abRouteSlackMs;
              const abReady=blockersKnown&&cur.collisionMs<=250&&upNear&&downNear;
              return{danger:true,noRoute:true,abReady,best:abReady?'AB':'WATCH',hitMs:cur.collisionMs,hit:cur.hit,
                upHit:up0.hit,downHit:down0.hit,upHitMs:up0.collisionMs,downHitMs:down0.collisionMs,
                routeUntil,up,down,stay:cur};
            }

            let best,latest;
            if(up>=0&&down<0){best='UP';latest=up;}
            else if(down>=0&&up<0){best='DOWN';latest=down;}
            else{
              const ue=evalPath(p,'UP',routeDanger,Math.max(0,up-80));
              const de=evalPath(p,'DOWN',routeDanger,Math.max(0,down-80));
              if((ue.minClearance??0)>(de.minClearance??0)){best='UP';latest=up;}else{best='DOWN';latest=down;}
            }
            return{danger:true,noRoute:false,best,latestMs:latest,hitMs:cur.collisionMs,hit:cur.hit,
              routeUntil,up,down,stay:cur};
          }

          """
          s=s[:a]+decision+s[b:]

          # Confirm all actions; clear stale stable state immediately when the candidate changes.
          a=s.index("  const ST={P1:{k:'',n:0,v:null}")
          b=s.index("  function print(name,r,enemyCount){",a)
          stable="""  const ST={P1:{k:'',n:0,v:null},P2:{k:'',n:0,v:null}},PRINT={P1:'',P2:''};
          function stable(name,r){
            const s=ST[name],h=r.hit||{},uh=r.upHit||{},dh=r.downHit||{};
            const action=!r.danger?'SAFE':r.watchOnly?'WATCH':r.noRoute?(r.abReady?'AB':'WATCH'):r.best;
            let k=action+'|'+(h.slot??-1)+'|'+(h.family??'');
            if(action==='AB')k+='|'+(uh.slot??-1)+'|'+(uh.family??'')+'|'+(dh.slot??-1)+'|'+(dh.family??'');
            if(k===s.k)s.n++;else{s.k=k;s.n=1;s.v=null;}
            const need=action==='SAFE'?2:action==='AB'?3:3;
            if(s.n>=need)s.v=r;
            return s.v;
          }

          """
          s=s[:a]+stable+s[b:]

          # Print state transitions. For AB/WATCH-no-route include route blockers for diagnosis.
          a=s.index("  function print(name,r,enemyCount){")
          b=s.index("  let timer=null,last=null;",a)
          printer="""  function print(name,r,enemyCount){
            if(!r)return;
            const h=r.hit||{},uh=r.upHit||{},dh=r.downHit||{};
            const action=!r.danger?'SAFE':r.watchOnly?'WATCH':r.noRoute?(r.abReady?'AB':'WATCH'):r.best;
            const sig=name+'|'+action+'|'+(h.slot??-1)+'|'+(h.family??'')+'|'+(uh.family??'')+'|'+(dh.family??'');
            if(sig===PRINT[name])return;PRINT[name]=sig;
            if(!r.danger)console.log('🟢',name,'OFFLINE SAFE','预测怪',enemyCount);
            else if(action==='WATCH'&&r.noRoute)console.log('🟠',name,'WATCH无路','当前'+r.hitMs+'ms',h.family||'?',
              'UP堵'+r.upHitMs+'ms',uh.family||'?','DOWN堵'+r.downHitMs+'ms',dh.family||'?','窗口'+r.routeUntil+'ms');
            else if(action==='WATCH')console.log('🟠',name,'WATCH','约'+r.hitMs+'ms','slot',h.slot,'type',h.type,'family',h.family||'?','source',h.source||'?');
            else if(action==='AB')console.log('🆘',name,'OFFLINE AB候选','当前'+r.hitMs+'ms',h.family,
              'UP堵'+r.upHitMs+'ms',uh.family||'?','DOWN堵'+r.downHitMs+'ms',dh.family||'?');
            else console.log(r.best==='UP'?'🟦 '+name+' ⬆ UP':'🟦 '+name+' ⬇ DOWN','约'+r.hitMs+'ms后危险','最晚'+r.latestMs+'ms后开始','UP',r.up,'DOWN',r.down,'窗口'+r.routeUntil+'ms','family',h.family||'?');
          }

          """
          s=s[:a]+printer+s[b:]
          s=s.replace("version:'offline-dynamic-p1p2-v4'","version:'offline-dynamic-p1p2-v4.2.2'",1)
          s=s.replace("console.log('✅ WOF V4 离线动态观战版启动');","console.log('✅ WOF V4.2.2 滚动逃生窗口观战版启动');",1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-p1p2-v4.2.2" wof_v4_install_once.js
          grep -q "WOF V4.2.2 滚动逃生窗口观战版启动" wof_v4_install_once.js
          grep -q "routeCommitMs:250" wof_v4_install_once.js
          grep -q "abRouteSlackMs:120" wof_v4_install_once.js
          echo "V4.2.2 bytes: $(wc -c < wof_v4_install_once.js)"
          sha256sum wof_v4_install_once.js
      - name: Commit complete script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade WOF V4.2.2 rolling escape window"
          git push
