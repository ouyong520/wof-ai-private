name: Assemble WOF V4.3.1
on:
  workflow_dispatch:
  push:
    paths:
      - 'wof_v4_parts/**'
      - '.github/workflows/assemble-v4.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and patch V4.3.1
        run: |
          cat wof_v4_parts/part01.txt \
              wof_v4_parts/part02.txt \
              wof_v4_parts/part03.txt \
              wof_v4_parts/part04.txt \
              wof_v4_parts/part05.txt \
              wof_v4_parts/part06.txt \
              wof_v4_parts/part07.txt \
              wof_v4_parts/part08.txt \
              wof_v4_parts/part09.txt \
              wof_v4_parts/part10.txt > wof_v4_install_once.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('wof_v4_install_once.js')
          s=p.read_text(encoding='utf-8')

          # Observer / rolling-planner / audit parameters.
          s=s.replace("cumulativeProbability:0.95,", "cumulativeProbability:0.95,\n    routeCommitMs:250,\n    abRouteSlackMs:120,\n    auditGraceMs:220,\n    auditTolX:14,\n    auditTolY:8,\n    auditTolZ:14,", 1)

          # Read HP plus player combat-state fields for ground-truth audit quality.
          old="return {name,flag,x:W(S32(base+4)),y:W(S32(base+8)),z:W(S32(base+12))};"
          new="return {name,flag,x:W(S32(base+4)),y:W(S32(base+8)),z:W(S32(base+12)),hp:B(base+0x83),body:U16(base+0x6E),attack:U16(base+0x70)};"
          if old not in s: raise SystemExit('readPlayer patch target missing')
          s=s.replace(old,new,1)
          old="PS[p.name]={name:p.name,x:cur.x,y:cur.y,z:cur.z,vx,vy,vz};"
          new="PS[p.name]={name:p.name,x:cur.x,y:cur.y,z:cur.z,vx,vy,vz,hp:cur.hp,body:cur.body,attack:cur.attack};"
          if old not in s: raise SystemExit('PS patch target missing')
          s=s.replace(old,new,1)

          # Unknown active-family fallback stays advisory only.
          s=s.replace("slot:o.slot,type:o.type,family:null,confidence:.35,source:'active-unknown'});","slot:o.slot,type:o.type,family:null,confidence:.20,source:'active-unknown'});",1)

          # Known-family actions only + rolling escape horizon.
          a=s.index("  function decision(p,danger){")
          b=s.index("  const ST={P1:{k:'',n:0,v:null}",a)
          decision="""  function decision(p,danger){
            const knownDanger=danger.filter(d=>d.source!=='active-unknown');
            const fullCur=evalPath(p,'CONTINUE',danger,0);
            const cur=evalPath(p,'CONTINUE',knownDanger,0);

            if(cur.safe){
              if(!fullCur.safe&&fullCur.hit?.source==='active-unknown')
                return{danger:true,watchOnly:true,best:'WATCH',hitMs:fullCur.collisionMs,hit:fullCur.hit,stay:fullCur};
              return{danger:false,best:'CONTINUE',stay:cur};
            }

            const routeUntil=Math.min(CFG.horizonMs,cur.collisionMs+CFG.routeCommitMs);
            const routeDanger=knownDanger.filter(d=>d.t<=routeUntil);
            const up0=evalPath(p,'UP',routeDanger,0),down0=evalPath(p,'DOWN',routeDanger,0);
            const up=up0.safe?latestSafe(p,'UP',routeDanger,cur.collisionMs):-1;
            const down=down0.safe?latestSafe(p,'DOWN',routeDanger,cur.collisionMs):-1;

            if(up<0&&down<0){
              const known=h=>!!h&&h.family!=null&&h.source!=='active-unknown';
              const blockersKnown=known(cur.hit)&&known(up0.hit)&&known(down0.hit);
              const upNear=up0.collisionMs!=null&&up0.collisionMs<=cur.collisionMs+CFG.abRouteSlackMs;
              const downNear=down0.collisionMs!=null&&down0.collisionMs<=cur.collisionMs+CFG.abRouteSlackMs;
              const abReady=blockersKnown&&cur.collisionMs<=250&&upNear&&downNear;
              return{danger:true,noRoute:true,abReady,best:abReady?'AB':'WATCH',hitMs:cur.collisionMs,hit:cur.hit,
                upHit:up0.hit,downHit:down0.hit,upHitMs:up0.collisionMs,downHitMs:down0.collisionMs,
                routeUntil,up,down,stay:cur};
            }

            let best,latest;
            if(up>=0&&down<0){best='UP';latest=up;}
            else if(down>=0&&up<0){best='DOWN';latest=down;}
            else{
              const ue=evalPath(p,'UP',routeDanger,Math.max(0,up-80));
              const de=evalPath(p,'DOWN',routeDanger,Math.max(0,down-80));
              if((ue.minClearance??0)>(de.minClearance??0)){best='UP';latest=up;}else{best='DOWN';latest=down;}
            }
            return{danger:true,noRoute:false,best,latestMs:latest,hitMs:cur.collisionMs,hit:cur.hit,
              routeUntil,up,down,stay:cur};
          }

          """
          s=s[:a]+decision+s[b:]

          # Stable actions.
          a=s.index("  const ST={P1:{k:'',n:0,v:null}")
          b=s.index("  function print(name,r,enemyCount){",a)
          stable="""  const ST={P1:{k:'',n:0,v:null},P2:{k:'',n:0,v:null}},PRINT={P1:'',P2:''};
          function actionOf(r){return !r?.danger?'SAFE':r.watchOnly?'WATCH':r.noRoute?(r.abReady?'AB':'WATCH'):r.best;}
          function stable(name,r){
            const s=ST[name],h=r.hit||{},uh=r.upHit||{},dh=r.downHit||{};
            const action=actionOf(r);
            let k=action+'|'+(h.slot??-1)+'|'+(h.family??'');
            if(action==='AB')k+='|'+(uh.slot??-1)+'|'+(uh.family??'')+'|'+(dh.slot??-1)+'|'+(dh.family??'');
            if(k===s.k)s.n++;else{s.k=k;s.n=1;s.v=null;}
            const need=action==='SAFE'?2:3;
            if(s.n>=need)s.v=r;
            return s.v;
          }

          """
          s=s[:a]+stable+s[b:]

          # Diagnostic printing + state-aware self-audit.
          a=s.index("  function print(name,r,enemyCount){")
          b=s.index("  let timer=null,last=null;",a)
          printer_and_audit="""  function print(name,r,enemyCount){
            if(!r)return;
            const h=r.hit||{},uh=r.upHit||{},dh=r.downHit||{};
            const action=actionOf(r);
            const sig=name+'|'+action+'|'+(h.slot??-1)+'|'+(h.family??'')+'|'+(uh.family??'')+'|'+(dh.family??'');
            if(sig===PRINT[name])return;PRINT[name]=sig;
            if(!r.danger)console.log('🟢',name,'OFFLINE SAFE','预测怪',enemyCount);
            else if(action==='WATCH'&&r.noRoute)console.log('🟠',name,'WATCH无路','当前'+r.hitMs+'ms',h.family||'?',
              'UP堵'+r.upHitMs+'ms',uh.family||'?','DOWN堵'+r.downHitMs+'ms',dh.family||'?','窗口'+r.routeUntil+'ms');
            else if(action==='WATCH')console.log('🟠',name,'WATCH','约'+r.hitMs+'ms','slot',h.slot,'type',h.type,'family',h.family||'?','source',h.source||'?');
            else if(action==='AB')console.log('🆘',name,'OFFLINE AB候选','当前'+r.hitMs+'ms',h.family,
              'src',h.source||'?','UP堵'+r.upHitMs+'ms',uh.family||'?','DOWN堵'+r.downHitMs+'ms',dh.family||'?');
            else console.log(r.best==='UP'?'🟦 '+name+' ⬆ UP':'🟦 '+name+' ⬇ DOWN','约'+r.hitMs+'ms后危险','最晚'+r.latestMs+'ms后开始','UP',r.up,'DOWN',r.down,'窗口'+r.routeUntil+'ms','family',h.family||'?','src',h.source||'?');
          }

          const AUD={
            P1:{pending:null,prevHp:null,lastWarnAt:-1e9,stats:{tested:0,hit:0,changed:0,stateChanged:0,falsePositive:0,safeMiss:0},byFamily:{}},
            P2:{pending:null,prevHp:null,lastWarnAt:-1e9,stats:{tested:0,hit:0,changed:0,stateChanged:0,falsePositive:0,safeMiss:0},byFamily:{}}
          };

          function famStat(A,e){
            const k=(e.family||'?')+'|'+(e.source||'?');
            return A.byFamily[k]||(A.byFamily[k]={tested:0,hit:0,changed:0,stateChanged:0,falsePositive:0});
          }
          function fmt(n){return Number.isFinite(n)?n.toFixed(1):'?';}
          function geoText(e){return 'inside x'+fmt(e.mx)+' y'+fmt(e.my)+' z'+fmt(e.mz)+' r '+fmt(e.rx)+'/'+fmt(e.ry)+'/'+fmt(e.rz)+' conf '+fmt(e.confidence);}

          function auditResolve(name,kind,e,extra=''){
            const A=AUD[name]; if(!e)return;
            const F=famStat(A,e);
            if(kind==='hit'){A.stats.hit++;F.hit++;console.log('🎯',name,'命中验证',e.action,e.family||'?',e.hitMs+'ms',geoText(e),extra);}
            else if(kind==='changed'){A.stats.changed++;F.changed++;console.log('🟡',name,'路径改变/无法判误报',e.action,e.family||'?',e.hitMs+'ms',extra);}
            else if(kind==='state'){A.stats.stateChanged++;F.stateChanged++;console.log('🟣',name,'角色状态改变/不计误报',e.action,e.family||'?',e.hitMs+'ms','BODY '+e.body0+'→'+e.bodyNow,'ATTACK '+e.attack0+'→'+e.attackNow,extra);}
            else if(kind==='fp'){A.stats.falsePositive++;F.falsePositive++;console.log('🔴',name,'疑似误报',e.action,e.family||'?',e.hitMs+'ms',geoText(e),'原路线和角色状态基本未变但未掉血',extra);}
            A.pending=null;
          }

          function auditStep(name,ps,st,now){
            const A=AUD[name],action=st?actionOf(st):null;
            const hp=ps.hp;
            const dropped=A.prevHp!=null&&hp<A.prevHp;

            if(dropped){
              if(A.pending&&now<=A.pending.deadline+200){
                auditResolve(name,'hit',A.pending,'HP '+A.prevHp+'→'+hp);
              }else if(now-A.lastWarnAt>350){
                A.stats.safeMiss++;
                console.log('❌',name,'SAFE漏判候选','HP '+A.prevHp+'→'+hp,'近350ms无稳定危险提示');
              }
            }
            A.prevHp=hp;

            const e=A.pending;
            if(e){
              if(ps.attack!==e.attack0||ps.body!==e.body0){e.stateChanged=true;e.attackNow=ps.attack;e.bodyNow=ps.body;}
              if(!e.sampled&&now>=e.due){
                const dt=e.hitMs/1000;
                const ex=e.x+e.vx*dt,ey=e.y+e.vy*dt,ez=e.z+e.vz*dt;
                e.dx=Math.abs(ps.x-ex);e.dy=Math.abs(ps.y-ey);e.dz=Math.abs(ps.z-ez);
                e.changed=e.dx>CFG.auditTolX||e.dy>CFG.auditTolY||e.dz>CFG.auditTolZ;
                e.sampled=true;
              }
              if(A.pending&&now>=e.deadline){
                const info='偏移 x'+fmt(e.dx)+' y'+fmt(e.dy)+' z'+fmt(e.dz);
                auditResolve(name,e.stateChanged?'state':e.changed?'changed':'fp',e,info);
              }
            }

            if(st&&action!=='SAFE')A.lastWarnAt=now;
            if(!A.pending&&st&&action!=='SAFE'&&st.hitMs!=null){
              const h=st.hit||{};
              // Only audit a clean neutral sample. Player attacks or missing BODY are not reliable ground truth.
              if(ps.attack!==0||ps.body===0)return;
              const hitMs=Math.max(CFG.reactFloorMs,+st.hitMs||0);
              const pp=playerAt(ps,'CONTINUE',hitMs,0);
              const rx=+h.rx||0,ry=+h.ry||0,rz=+h.rz||0;
              A.pending={action,family:h.family||null,source:h.source||null,slot:h.slot,
                t0:now,due:now+hitMs,deadline:now+hitMs+CFG.auditGraceMs,hitMs,
                x:ps.x,y:ps.y,z:ps.z,vx:ps.vx,vy:ps.vy,vz:ps.vz,hp:ps.hp,
                body0:ps.body,attack0:ps.attack,bodyNow:ps.body,attackNow:ps.attack,stateChanged:false,
                rx,ry,rz,confidence:+h.confidence||0,
                mx:rx-Math.abs(pp.x-(+h.x||0)),my:ry-Math.abs(pp.y-(+h.y||0)),mz:rz-Math.abs(pp.z-(+h.z||0)),
                sampled:false,changed:false,dx:null,dy:null,dz:null};
              A.stats.tested++;famStat(A,A.pending).tested++;
            }
          }

          function auditSnapshot(){
            const out={};
            for(const n of ['P1','P2'])out[n]={...AUD[n].stats,pending:AUD[n].pending?{
              action:AUD[n].pending.action,family:AUD[n].pending.family,hitMs:AUD[n].pending.hitMs,source:AUD[n].pending.source}:null};
            return out;
          }
          function auditFamilies(){
            const out={};
            for(const n of ['P1','P2'])out[n]=Object.entries(AUD[n].byFamily).map(([family,v])=>({family,...v,precision:(v.hit+v.falsePositive)?v.hit/(v.hit+v.falsePositive):null})).sort((a,b)=>(b.falsePositive-a.falsePositive)||(b.tested-a.tested));
            return out;
          }

          """
          s=s[:a]+printer_and_audit+s[b:]

          # Audit after stable decision creation.
          a=s.index("  function tick(){")
          b=s.index("  self.WOFV4={",a)
          tick="""  function tick(){
            const now=performance.now();updatePlayers(now);const d=buildDanger(now);last={at:now,players:{},enemyCount:d.enemies.size,dangerPoints:d.danger.length,exact:d.exact,coarse:d.coarse};
            for(const p of PLAYERS){
              const ps=PS[p.name];if(!ps)continue;
              const raw=decision(ps,d.danger),st=stable(p.name,raw);
              last.players[p.name]={raw,stable:st,state:{...ps}};
              auditStep(p.name,ps,st,now);
              print(p.name,st,d.enemies.size);
            }
            self.WOFV4.last=last;
          }

          """
          s=s[:a]+tick+s[b:]

          s=s.replace("version:'offline-dynamic-p1p2-v4'","version:'offline-dynamic-p1p2-v4.3.1'",1)
          s=s.replace("status(){return{version:this.version,db:this.dbInfo,last:this.last,players:PS};},","status(){return{version:this.version,db:this.dbInfo,last:this.last,players:PS,audit:auditSnapshot(),auditFamilies:auditFamilies()};},\n    audit(){return auditSnapshot();},\n    auditFamilies(){return auditFamilies();},",1)
          s=s.replace("console.log('✅ WOF V4 离线动态观战版启动');","console.log('✅ WOF V4.3.1 状态感知自验证观战版启动');\n  console.log('🧪 验证: 🎯命中 / 🟡路径改变 / 🟣角色状态改变 / 🔴疑似误报 / ❌SAFE漏判');",1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-p1p2-v4.3.1" wof_v4_install_once.js
          grep -q "WOF V4.3.1 状态感知自验证观战版启动" wof_v4_install_once.js
          grep -q "auditFamilies(){return auditFamilies();}" wof_v4_install_once.js
          grep -q "body:U16(base+0x6E),attack:U16(base+0x70)" wof_v4_install_once.js
          echo "V4.3.1 bytes: $(wc -c < wof_v4_install_once.js)"
          sha256sum wof_v4_install_once.js
      - name: Commit complete script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade WOF V4.3.1 state-aware audit"
          git push
