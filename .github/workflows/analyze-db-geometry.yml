name: Analyze WOF DB Geometry
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/extract_db_geometry.py'
      - '.github/workflows/analyze-db-geometry.yml'
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract embedded DB geometry
        run: |
          python3 tools/extract_db_geometry.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/db_geometry_report.json
          git diff --cached --quiet && exit 0
          git commit -m "Report WOF embedded DB geometry"
          git push
