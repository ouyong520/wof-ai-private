name: Upgrade WOF V4.3.6
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v436.py'
      - '.github/workflows/upgrade-v436.yml'
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch current runtime to V4.3.6
        run: |
          python3 tools/patch_v436.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-local-p123-v4.3.6" wof_v4_install_once.js
          grep -q "WOF V4.3.6 本机角色容错映射观战版启动" wof_v4_install_once.js
          grep -q "sole-live-fallback" wof_v4_install_once.js
          echo "V4.3.6 bytes: $(wc -c < wof_v4_install_once.js)"
          sha256sum wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade WOF V4.3.6 local actor fallback"
          git push
