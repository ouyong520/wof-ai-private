name: Upgrade WOF V4.9
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v490.py'
      - '.github/workflows/upgrade-v490.yml'
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.9
        run: |
          python3 tools/patch_v490.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.9" wof_v4_install_once.js
          grep -q "WOF V4.9 共享几何类学习观战版启动" wof_v4_install_once.js
          grep -q "CAL_GEOM" wof_v4_install_once.js
          grep -q "geoClasses" wof_v4_install_once.js
          echo "V4.9 bytes: $(wc -c < wof_v4_install_once.js)"
          sha256sum wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade WOF V4.9 shared geometry-class learning"
          git push
