name: Upgrade WOF V4.7
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v470.py'
      - '.github/workflows/upgrade-v470.yml'
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.7
        run: |
          python3 tools/patch_v470.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.7" wof_v4_install_once.js
          grep -q "WOF V4.7 边缘壳深度校准观战版启动" wof_v4_install_once.js
          grep -q "actionPenetrationMin:0.10" wof_v4_install_once.js
          grep -q "WATCH-边缘" wof_v4_install_once.js
          grep -q "sourceDemoteConfirmed:2" wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade WOF V4.7 penetration-aware danger"
          git push
