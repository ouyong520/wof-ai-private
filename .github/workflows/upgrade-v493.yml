name: Upgrade WOF V4.9.3

on:
  push:
    paths:
      - 'tools/patch_v493.py'
      - '.github/workflows/upgrade-v493.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.9.3
        run: |
          python3 tools/patch_v493.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.9.3" wof_v4_install_once.js
          grep -q "WOF V4.9.3 安全影子恢复观战版启动" wof_v4_install_once.js
          grep -q "shadowWatchOnly" wof_v4_install_once.js
          grep -q "watchCovered" wof_v4_install_once.js
          grep -q "shadowDamageCoverage" wof_v4_install_once.js
          echo "V4.9.3 bytes: $(wc -c < wof_v4_install_once.js)"
          sha256sum wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "ouyong520"
          git config user.email "70991166+ouyong520@users.noreply.github.com"
          git add wof_v4_install_once.js
          git commit -m "Upgrade WOF runtime to V4.9.3" || exit 0
          git push
