name: Upgrade WOF V4.9.8

on:
  push:
    paths:
      - 'tools/patch_v498.py'
      - '.github/workflows/upgrade-v498.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.9.8
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/patch_v498.py')
          s=p.read_text(encoding='utf-8')
          old="""    if old not in s:\n        raise SystemExit(f'missing target: {label}')"""
          new="""    if old not in s:\n        if label=='total tail covered':\n            return\n        raise SystemExit(f'missing target: {label}')"""
          if old not in s:
              raise SystemExit('cannot patch helper')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python tools/patch_v498.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.9.8" wof_v4_install_once.js
          grep -q "攻击尾帧护栏/漏判聚合版启动" wof_v4_install_once.js
          grep -q "attackTailGuardMs" wof_v4_install_once.js
          grep -q "missAttackTop" wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          if git diff --cached --quiet; then
            echo "No runtime changes"
          else
            git commit -m "Upgrade runtime to V4.9.8"
            git push
          fi
