name: EFIELD incremental atlas cross-session refresh

on:
  push:
    paths:
      - '.github/workflows/efield-atlas-cross-session-refresh.yml'
      - 'tools/efield_atlas_cross_session_refresh.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch atlas additively
        run: python tools/efield_atlas_cross_session_refresh.py
      - name: Commit atlas refresh
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- reports/EFIELD_WIN_KAWAKS_ENEMY_FIELD_ATLAS.md)" ]]; then
            echo 'Atlas already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/EFIELD_WIN_KAWAKS_ENEMY_FIELD_ATLAS.md
          git commit -m 'EFIELD: consolidate run4 cross-session field evidence'
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push
