name: Upgrade WOF V4.11.2

on:
  push:
    paths:
      - 'tools/patch_v4112.py'
      - '.github/workflows/upgrade-v4112.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime to V4.11.2
        run: |
          python tools/patch_v4112.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.11.2" wof_v4_install_once.js
          grep -q "damageWarningAttribution" wof_v4_install_once.js
          grep -q "实际掉血警告来源归因版" wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          if git diff --cached --quiet; then
            echo "No runtime changes"
          else
            git commit -m "Upgrade runtime to V4.11.2"
            git push
          fi
