name: alpha-p47-bounded-owner-diagnostic-readiness

on:
  push:
    paths:
      - 'parallel/OWNER_DIAGNOSTIC/p47_bounded_owner_diagnostic_readiness_gate.py'
      - 'parallel/OWNER_DIAGNOSTIC/p47_bounded_owner_diagnostic_readiness_gate_final.py'
      - 'parallel/OWNER_DIAGNOSTIC/test_p47_bounded_owner_diagnostic_readiness_gate.py'
      - 'parallel/OWNER_DIAGNOSTIC/test_p47_terminal_result_bytes.py'
      - 'parallel/OWNER_DIAGNOSTIC/P47_BOUNDED_OWNER_DIAGNOSTIC_READINESS.json'
      - '.github/workflows/alpha-p47-bounded-owner-diagnostic-readiness.yml'
  workflow_dispatch:

jobs:
  focused-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          python -m py_compile \
            parallel/OWNER_DIAGNOSTIC/p47_bounded_owner_diagnostic_readiness_gate.py \
            parallel/OWNER_DIAGNOSTIC/p47_bounded_owner_diagnostic_readiness_gate_final.py \
            parallel/OWNER_DIAGNOSTIC/test_p47_bounded_owner_diagnostic_readiness_gate.py \
            parallel/OWNER_DIAGNOSTIC/test_p47_terminal_result_bytes.py
      - name: Focused synthetic fail-closed matrix
        run: |
          python parallel/OWNER_DIAGNOSTIC/test_p47_bounded_owner_diagnostic_readiness_gate.py
          python parallel/OWNER_DIAGNOSTIC/test_p47_terminal_result_bytes.py
      - name: Exact repo readiness classification
        run: |
          python parallel/OWNER_DIAGNOSTIC/p47_bounded_owner_diagnostic_readiness_gate_final.py \
            --repo-root . --output /tmp/P47_BOUNDED_OWNER_DIAGNOSTIC_READINESS.json
      - name: Assert one-run READY contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/P47_BOUNDED_OWNER_DIAGNOSTIC_READINESS.json').read_text())
          assert p['decision'] == 'READY_FOR_ONE_BOUNDED_OWNER_DIAGNOSTIC', p
          assert p['runBudget'] == 1, p
          assert p['requestedRunBudget'] == 1, p
          assert p['blockerCodes'] == [], p
          assert p['p40']['state'] == 'BLOCKED', p
          assert p['p40']['resolvedByP47'] is False, p
          assert p['authority']['rendererAuthorityMinted'] is False, p
          assert p['authority']['retryEligibilityMinted'] is False, p
          assert p['authority']['promotionEligibilityMinted'] is False, p
          assert p['authority']['sourceExportMinted'] is False, p
          assert all(p['checks'].values()), [k for k,v in p['checks'].items() if not v]
          PY
