name: Upgrade WOF V4.9.9

on:
  push:
    paths:
      - 'tools/patch_v499.py'
      - '.github/workflows/upgrade-v499.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.9.9
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/patch_v499.py')
          s=p.read_text(encoding='utf-8')
          old="""rep(
          \"\"\"const total={tested:0,hit:0,changed:0,enemyChanged:0,ambiguousDamage:0,revoked:0,falsePositive:0,weakFalsePositive:0,watchCovered:0,shadowCovered:0,guardCovered:0,tailCovered:0,watchPromoted:0,\"\"\",
          \"\"\"const total={tested:0,hit:0,changed:0,enemyChanged:0,ambiguousDamage:0,revoked:0,falsePositive:0,weakFalsePositive:0,watchCovered:0,shadowCovered:0,guardCovered:0,tailCovered:0,bridgeCovered:0,watchPromoted:0,\"\"\",
          'total bridge covered')

          """
          if old not in s:
              raise SystemExit('redundant total block not found')
          p.write_text(s.replace(old,'',1),encoding='utf-8')
          PY
          python tools/patch_v499.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.9.9" wof_v4_install_once.js
          grep -q "稳定桥/覆盖收敛版启动" wof_v4_install_once.js
          grep -q "debounceBridgeMs" wof_v4_install_once.js
          grep -q "bridgeCovered" wof_v4_install_once.js
          grep -q "debounceWatchOnly" wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          if git diff --cached --quiet; then
            echo "No runtime changes"
          else
            git commit -m "Upgrade runtime to V4.9.9"
            git push
          fi
