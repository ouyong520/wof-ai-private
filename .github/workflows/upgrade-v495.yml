name: Upgrade WOF V4.9.5

on:
  push:
    paths:
      - 'tools/patch_v495.py'
      - '.github/workflows/upgrade-v495.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.9.5
        run: |
          python3 tools/patch_v495.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.9.5" wof_v4_install_once.js
          grep -q "WOF V4.9.5 中性存在/主动攻击护栏观战版启动" wof_v4_install_once.js
          grep -q "guardDamageCoverage" wof_v4_install_once.js
          grep -q "active-guard" wof_v4_install_once.js
          echo "V4.9.5 bytes: $(wc -c < wof_v4_install_once.js)"
          sha256sum wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade runtime to V4.9.5"
          git push
