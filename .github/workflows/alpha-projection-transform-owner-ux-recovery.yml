name: Alpha Projection Transform Owner UX Recovery

on:
  push:
    paths:
      - '.github/workflows/alpha-projection-transform-owner-ux-recovery.yml'
      - 'parallel/HUDANCHOR_PROOF/wof_owner_projection_top.js'
      - 'parallel/HUDANCHOR_PROOF/wof_owner_projection_worker.js'
      - 'parallel/PYLAUNCH/wof_launcher/alpha_runtime.py'
      - 'parallel/PYLAUNCH/wof_launcher/projection_recovery.py'
      - 'parallel/PYLAUNCH/wof_launcher/state.py'
      - 'parallel/PYLAUNCH/tests/test_projection_transform_owner_ux_recovery.py'
      - 'parallel/PYLAUNCH/tests/test_overlay_reentry_recovery.py'
      - 'parallel/PYLAUNCH/tests/test_owner_calibration_identity_recovery.py'
      - 'parallel/OPTOOLKIT/live_session.py'
      - 'parallel/OPTOOLKIT/owner_zh_cn.py'
      - 'product/alpha/wof_alpha_enemy_target_labels.js'
      - 'product/alpha/wof_alpha_player_head_warning.js'
      - 'product/alpha/wof_alpha_field_adapter.js'
  workflow_dispatch:

jobs:
  projection-transform-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PYLAUNCH test dependencies
        run: python -m pip install --disable-pip-version-check -q -r parallel/PYLAUNCH/requirements.txt
      - name: Projection transform and novice Owner UX deterministic regression
        run: python -m unittest discover -s parallel/PYLAUNCH/tests -p 'test_projection_transform_owner_ux_recovery.py' -v
      - name: Exact runtime authority and re-entry regression
        run: python -m unittest discover -s parallel/PYLAUNCH/tests -p 'test_overlay_reentry_recovery.py' -v
      - name: Camera READY, lifecycle, and Tk continuity regression
        run: |
          python parallel/PYLAUNCH/tests/test_owner_calibration_identity_recovery.py OwnerCalibrationIdentityRecoveryTests.test_hudanchor_need_more_pauses_and_resumes_without_losing_samples -v
          python parallel/PYLAUNCH/tests/test_owner_calibration_identity_recovery.py OwnerCalibrationIdentityRecoveryTests.test_field_adapter_lifecycle_identity_matrix_is_strict -v
          python parallel/PYLAUNCH/tests/test_owner_calibration_identity_recovery.py OwnerCalibrationIdentityRecoveryTests.test_tk_dispatcher_repeated_callbacks_use_one_ui_thread_and_close_cleanly -v
      - name: Operator live evidence regression
        run: python -m unittest discover -s parallel/OPTOOLKIT/tests -p 'test_*.py' -v
      - name: Alpha head overlay regressions
        run: |
          node product/alpha/player_head_warning_regression.mjs
          node product/alpha/enemy_target_labels_regression.mjs
          node product/alpha/regression.mjs
      - name: Runtime syntax and strict safety boundaries
        run: |
          node --check parallel/HUDANCHOR_PROOF/wof_owner_projection_top.js
          node --check parallel/HUDANCHOR_PROOF/wof_owner_projection_worker.js
          node --check product/alpha/wof_alpha_enemy_target_labels.js
          node --check product/alpha/wof_alpha_player_head_warning.js
          node --check product/alpha/wof_alpha_field_adapter.js
          python -m py_compile parallel/PYLAUNCH/wof_launcher/alpha_runtime.py parallel/PYLAUNCH/wof_launcher/projection_recovery.py parallel/PYLAUNCH/wof_launcher/state.py parallel/OPTOOLKIT/live_session.py parallel/OPTOOLKIT/owner_zh_cn.py
          python - <<'PY'
          from pathlib import Path
          top = Path('parallel/HUDANCHOR_PROOF/wof_owner_projection_top.js').read_text(encoding='utf-8')
          adapter = Path('product/alpha/wof_alpha_field_adapter.js').read_text(encoding='utf-8')
          owner = Path('parallel/OPTOOLKIT/owner_zh_cn.py').read_text(encoding='utf-8')
          for forbidden in ('Y-Z','Y+Z','选择模型','候选模型'):
              assert forbidden not in top
              assert forbidden not in owner
          assert 'getPoints:()=>[]' in top
          assert 'maxCalibrationClicksPerAuthorityGeneration:1' in top
          for token in ('readOnly:true','ramWrites:0','inputInjection:false'):
              assert token in adapter
          assert "{0:'P1',4:'P2',8:'P3'}" in Path('product/alpha/wof_alpha_enemy_target_labels.js').read_text(encoding='utf-8')
          PY
