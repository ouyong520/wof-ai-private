name: Alpha Final Canonical Candidate Rebuild Contract

on:
  push:
    branches: [main]
    paths:
      - 'parallel/OWNER_ONECLICK/final_canonical_candidate.py'
      - 'parallel/OWNER_ONECLICK/test_final_canonical_candidate.py'
      - 'parallel/OWNER_ONECLICK/post_repair_final_candidate_rebuild.py'
      - 'parallel/OWNER_ONECLICK/test_post_repair_final_candidate_rebuild.py'
      - 'parallel/OWNER_ONECLICK/WOF_ALPHA_BUILD_FINAL_CANONICAL_CANDIDATE.cmd'
      - '.github/workflows/alpha-p19-final-canonical-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Observe alpha-live without moving it
        shell: bash
        run: git fetch origin alpha-live:refs/remotes/origin/alpha-live || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile final-candidate rebuild code
        shell: bash
        run: |
          python -m py_compile \
            parallel/OWNER_ONECLICK/final_canonical_candidate.py \
            parallel/OWNER_ONECLICK/test_final_canonical_candidate.py \
            parallel/OWNER_ONECLICK/post_repair_final_candidate_rebuild.py \
            parallel/OWNER_ONECLICK/test_post_repair_final_candidate_rebuild.py
      - name: Focused deterministic rebuild regression
        shell: bash
        run: |
          cd parallel/OWNER_ONECLICK
          python -m unittest -v test_final_canonical_candidate.py test_post_repair_final_candidate_rebuild.py
      - name: Assert contract verification emitted no repository candidate changes
        shell: bash
        run: git diff --exit-code -- parallel/OWNER_ONECLICK/CANDIDATES
