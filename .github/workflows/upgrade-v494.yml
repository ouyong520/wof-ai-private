name: Upgrade WOF V4.9.4

on:
  push:
    paths:
      - 'tools/patch_v494.py'
      - '.github/workflows/upgrade-v494.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.9.4
        run: |
          python3 tools/patch_v494.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.9.4" wof_v4_install_once.js
          grep -q "WOF V4.9.4 死亡/受击保护审计版启动" wof_v4_install_once.js
          grep -q "protectedIgnored" wof_v4_install_once.js
          grep -q "postDamageGuardMs:700" wof_v4_install_once.js
          grep -q "respawnGuardMs:1500" wof_v4_install_once.js
          echo "V4.9.4 bytes: $(wc -c < wof_v4_install_once.js)"
          sha256sum wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git commit -m "Upgrade WOF runtime to V4.9.4" || exit 0
          git push
