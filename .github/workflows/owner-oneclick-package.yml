name: Owner One-Click Package

on:
  push:
    paths:
      - '.github/workflows/owner-oneclick-package.yml'
      - 'WOF_一键工具.cmd'
      - 'WOF_TOOLKIT.cmd'
      - 'parallel/OWNER_ONECLICK/**'
      - 'parallel/OPTOOLKIT/**'
      - 'parallel/PYLAUNCH/**'
      - 'parallel/HUDANCHOR_PROOF/**'
      - 'parallel/BROWSER_FLEET/**'
      - 'parallel/WOF052L_RECORDER/**'
      - 'product/alpha/**'
  workflow_dispatch:

jobs:
  field-recovery-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PYLAUNCH test dependencies
        run: python -m pip install --disable-pip-version-check -q -r parallel/PYLAUNCH/requirements.txt
      - name: Exact identity, generation cache and Alpha activation self-check
        run: python -m unittest discover -s parallel/PYLAUNCH/tests -p 'test_field_recovery.py' -v
      - name: Overlay projection and room re-entry recovery self-check
        run: python -m unittest discover -s parallel/PYLAUNCH/tests -p 'test_overlay_reentry_recovery.py' -v
      - name: Discovery late-readiness and association self-check
        working-directory: parallel/PYLAUNCH
        run: python -m unittest discover -s tests -p 'test_discovery_v2.py' -v
      - name: Live proof Alpha gate self-check
        run: python -m unittest discover -s parallel/PYLAUNCH/tests -p 'test_windows_proof.py' -v
      - name: Owner menu and automatic evidence integration self-check
        run: python -m unittest discover -s parallel/OPTOOLKIT/tests -p 'test_*.py' -v
      - name: Frozen Alpha product regression
        run: node product/alpha/regression.mjs
      - name: Syntax-check overlay recovery runtime
        run: |
          python -m py_compile \
            parallel/PYLAUNCH/launcher.py \
            parallel/PYLAUNCH/wof_launcher/alpha_runtime.py \
            parallel/PYLAUNCH/wof_launcher/cdp.py \
            parallel/PYLAUNCH/wof_launcher/discovery_v2.py \
            parallel/PYLAUNCH/wof_launcher/monitor.py \
            parallel/PYLAUNCH/wof_launcher/probe_v2.py \
            parallel/PYLAUNCH/wof_launcher/projection_recovery.py \
            parallel/PYLAUNCH/wof_launcher/reentry_discovery.py \
            parallel/PYLAUNCH/wof_launcher/runtime_authority.py \
            parallel/OPTOOLKIT/toolkit.py \
            parallel/OPTOOLKIT/owner_zh_cn.py \
            parallel/OPTOOLKIT/live_session.py
          node --check parallel/HUDANCHOR_PROOF/wof_owner_projection_worker.js
          node --check parallel/HUDANCHOR_PROOF/wof_owner_projection_top.js
          node --check parallel/HUDANCHOR_PROOF/wof_hudanchor_gl.js

  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate successor manifest and mutation/LKG contracts
        run: python parallel/OWNER_ONECLICK/test_package.py
      - name: Emit deterministic current-commit candidate manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/field-recovery-candidate-manifest.json"
          python parallel/OWNER_ONECLICK/refresh_manifest.py --source "$GITHUB_SHA" --output "$OUT"
          echo 'FIELD_RECOVERY_CANDIDATE_MANIFEST_BEGIN'
          cat "$OUT"
          echo 'FIELD_RECOVERY_CANDIDATE_MANIFEST_END'

  windows-oneclick:
    runs-on: windows-latest
    env:
      WOF_BOOTSTRAP_URL: https://raw.githubusercontent.com/ouyong520/wof-ai-private/${{ github.sha }}/parallel/OWNER_ONECLICK/bootstrap_v2.ps1
      WOF_MANIFEST_URL: https://raw.githubusercontent.com/ouyong520/wof-ai-private/${{ github.sha }}/parallel/OWNER_ONECLICK/package_manifest.json
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load immutable checkout package manifest
        shell: powershell
        run: |
          $manifestPath = Join-Path (Get-Location) 'parallel\OWNER_ONECLICK\package_manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw 'package manifest missing from checkout' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $version = [string]$manifest.packageVersion
          $sourceCommit = ([string]$manifest.sourceCommit).ToLowerInvariant()
          if ($version -notmatch '^[A-Za-z0-9._-]+$') { throw 'manifest packageVersion is invalid' }
          if ($sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'manifest sourceCommit is invalid' }
          if ([string]$manifest.baseUrl -ne ('https://raw.githubusercontent.com/ouyong520/wof-ai-private/' + $sourceCommit + '/')) { throw 'manifest baseUrl does not match sourceCommit' }
          foreach ($component in @('ownerOneclick','alpha','pylaunch','operatorToolkit','projectionProof','recorder','browserFleet','liveProof')) {
            if ([string]$manifest.components.$component.sourceCommit -ne $sourceCommit) { throw ('component sourceCommit mismatch: ' + $component) }
          }
          if ($manifest.safety.readOnly -ne $true -or [int]$manifest.safety.ramWrites -ne 0 -or $manifest.safety.inputInjection -ne $false) { throw 'manifest safety flags changed' }
          if (-not $manifest.files -or $manifest.files.Count -lt 1) { throw 'manifest has no files' }
          & git cat-file -e ($sourceCommit + '^{commit}')
          if ($LASTEXITCODE -ne 0) { throw 'manifest source commit is not in checkout history' }
          ('WOF_PACKAGE_VERSION=' + $version) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ('WOF_SOURCE_COMMIT=' + $sourceCommit) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fresh install in Chinese and space portable path
        shell: powershell
        run: |
          $cn = [string]([char]0x4E2D) + [char]0x6587
          $launcherDir = Join-Path $env:RUNNER_TEMP ('WOF ' + $cn + ' Portable Launcher')
          New-Item -ItemType Directory -Path $launcherDir -Force | Out-Null
          $entryName = 'WOF_' + [char]0x4E00 + [char]0x952E + [char]0x5DE5 + [char]0x5177 + '.cmd'
          $sourceEntry = Join-Path (Get-Location) $entryName
          $entry = Join-Path $launcherDir $entryName
          Copy-Item -LiteralPath $sourceEntry -Destination $entry -Force
          $cmdLine = 'call "' + $entry + '" --update-only'
          cmd.exe /d /c $cmdLine
          if ($LASTEXITCODE -ne 0) { throw ('fresh portable install failed: ' + $LASTEXITCODE) }

          $root = Join-Path $launcherDir 'WOF_Portable'
          $current = Join-Path $root 'current.txt'
          if (-not (Test-Path -LiteralPath $current)) { throw 'portable current.txt missing after fresh install' }
          $version = (Get-Content -LiteralPath $current -Raw).Trim()
          if ($version -ne $env:WOF_PACKAGE_VERSION) { throw ('unexpected installed version: ' + $version) }
          $release = Join-Path $root ('releases\' + $version)
          foreach ($p in @(
            'installed.ok',
            'PACKAGE_MANIFEST.json',
            'WOF_TOOLKIT.cmd',
            'parallel\OWNER_ONECLICK\bootstrap_v2.ps1',
            'parallel\OPTOOLKIT\owner_zh_cn.py',
            'parallel\OPTOOLKIT\live_session.py',
            'parallel\PYLAUNCH\launcher.py',
            'parallel\PYLAUNCH\wof_launcher\alpha_runtime.py',
            'parallel\PYLAUNCH\wof_launcher\discovery_v2.py',
            'parallel\PYLAUNCH\wof_launcher\monitor.py',
            'parallel\PYLAUNCH\wof_launcher\probe_v2.py',
            'parallel\PYLAUNCH\wof_launcher\projection_recovery.py',
            'parallel\PYLAUNCH\wof_launcher\reentry_discovery.py',
            'parallel\PYLAUNCH\wof_launcher\runtime_authority.py',
            'parallel\HUDANCHOR_PROOF\wof_hudanchor_gl.js',
            'parallel\HUDANCHOR_PROOF\wof_owner_projection_worker.js',
            'parallel\HUDANCHOR_PROOF\wof_owner_projection_top.js',
            'product\alpha\wof_alpha_field_adapter.js',
            'product\alpha\wof_alpha_enemy_head_projection.json',
            'product\alpha\wof_alpha_player_head_projection.json'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $release $p))) { throw ('installed overlay-reentry file missing: ' + $p) }
          }

          $repoManifest = Get-Content -LiteralPath (Join-Path (Get-Location) 'parallel\OWNER_ONECLICK\package_manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $installedManifest = Get-Content -LiteralPath (Join-Path $release 'PACKAGE_MANIFEST.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$installedManifest.packageVersion -ne [string]$repoManifest.packageVersion) { throw 'installed package version mismatch' }
          if (([string]$installedManifest.sourceCommit).ToLowerInvariant() -ne ([string]$repoManifest.sourceCommit).ToLowerInvariant()) { throw 'installed source commit mismatch' }
          $expected = @{}
          foreach ($f in $repoManifest.files) { $expected[[string]$f.path] = ([string]$f.gitBlobSha).ToLowerInvariant() }
          foreach ($f in $installedManifest.files) {
            $rel = [string]$f.path
            if (-not $expected.ContainsKey($rel)) { throw ('unexpected installed manifest path: ' + $rel) }
            $full = Join-Path $release ($rel -replace '/', '\')
            if (-not (Test-Path -LiteralPath $full)) { throw ('installed file missing: ' + $rel) }
            $actual = (& git hash-object -- $full).Trim().ToLowerInvariant()
            if ($actual -ne $expected[$rel]) { throw ('installed blob mismatch: ' + $rel) }
          }
          if (Get-ChildItem -LiteralPath (Join-Path $root 'releases') -Directory -Filter '*.staging-*') { throw 'staging directory remained after fresh install' }
          ('WOF_PORTABLE_TEST_ROOT=' + $root) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ('WOF_PORTABLE_ENTRY=' + $entry) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke package-selected live acceptance launcher path without Browser
        shell: powershell
        run: |
          $release = Join-Path $env:WOF_PORTABLE_TEST_ROOT ('releases\' + $env:WOF_PACKAGE_VERSION)
          $venvPython = Join-Path $env:WOF_PORTABLE_TEST_ROOT 'venv\Scripts\python.exe'
          $launcher = Join-Path $release 'parallel\PYLAUNCH\launcher.py'
          $status = Join-Path $env:RUNNER_TEMP 'OVERLAY_REENTRY_WINDOWS_PROOF_STATUS.json'
          & $venvPython $launcher --no-tray --once --attach-only --activate-alpha --package-root $release --proof-json $status
          if ($LASTEXITCODE -ne 0) { throw ('packaged launcher smoke failed: ' + $LASTEXITCODE) }
          if (-not (Test-Path -LiteralPath $status)) { throw 'proof status was not written' }
          $proof = Get-Content -LiteralPath $status -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($proof.readOnly -ne $true -or [int]$proof.ramWrites -ne 0 -or $proof.inputInjection -ne $false) { throw 'proof safety flags changed' }
          if ([string]$proof.automatedResult -ne 'WAITING') { throw 'no-Browser smoke must fail closed as WAITING' }
          if (-not $proof.ownerSummaryZh -or -not $proof.checksZh) { throw 'Chinese proof surface missing' }

      - name: Explicit update preserves last-known-good and repairs current pointer
        shell: powershell
        run: |
          $root = $env:WOF_PORTABLE_TEST_ROOT
          $previousVersion = 'ci.previous'
          $old = Join-Path $root ('releases\' + $previousVersion)
          New-Item -ItemType Directory -Path $old -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $old 'installed.ok') -Value 'previous package' -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $root 'current.txt') -Value $previousVersion -Encoding ASCII
          $cmdLine = 'call "' + $env:WOF_PORTABLE_ENTRY + '" --update-only'
          cmd.exe /d /c $cmdLine
          if ($LASTEXITCODE -ne 0) { throw ('explicit update failed: ' + $LASTEXITCODE) }
          $version = (Get-Content -LiteralPath (Join-Path $root 'current.txt') -Raw).Trim()
          if ($version -ne $env:WOF_PACKAGE_VERSION) { throw 'explicit update did not restore immutable current candidate' }
          if (-not (Test-Path -LiteralPath (Join-Path $old 'installed.ok'))) { throw 'last-known-good previous release was removed' }
          if (-not (Test-Path -LiteralPath (Join-Path $root ('releases\' + $env:WOF_PACKAGE_VERSION + '\installed.ok')))) { throw 'current release missing after update' }
          if (Get-ChildItem -LiteralPath (Join-Path $root 'releases') -Directory -Filter '*.staging-*') { throw 'staging directory remained after update' }

      - name: Re-run explicit updater idempotently
        shell: powershell
        run: |
          $cmdLine = 'call "' + $env:WOF_PORTABLE_ENTRY + '" --update-only'
          cmd.exe /d /c $cmdLine
          if ($LASTEXITCODE -ne 0) { throw ('second explicit update failed: ' + $LASTEXITCODE) }
          $version = (Get-Content -LiteralPath (Join-Path $env:WOF_PORTABLE_TEST_ROOT 'current.txt') -Raw).Trim()
          if ($version -ne $env:WOF_PACKAGE_VERSION) { throw 'immutable candidate changed on idempotent update' }
          if (-not (Test-Path -LiteralPath (Join-Path $env:WOF_PORTABLE_TEST_ROOT 'releases\ci.previous\installed.ok'))) { throw 'last-known-good missing after idempotent update' }
