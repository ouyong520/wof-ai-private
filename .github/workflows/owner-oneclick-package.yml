name: Owner One-Click Package

on:
  push:
    paths:
      - '.github/workflows/owner-oneclick-package.yml'
      - 'WOF_一键工具.cmd'
      - 'WOF_TOOLKIT.cmd'
      - 'parallel/OWNER_ONECLICK/**'
      - 'parallel/OPTOOLKIT/**'
      - 'parallel/PYLAUNCH/**'
      - 'parallel/BROWSER_FLEET/**'
      - 'parallel/WOF052L_RECORDER/**'
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifest, PYLAUNCH freshness, update and rollback contracts
        run: python parallel/OWNER_ONECLICK/test_package.py

      - name: Regression - workflow metadata stays manifest-driven
        if: always()
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/owner-oneclick-package.yml').read_text(encoding='utf-8')
          manifest = json.loads(Path('parallel/OWNER_ONECLICK/package_manifest.json').read_text(encoding='utf-8-sig'))

          package_version = str(manifest['packageVersion'])
          source_commit = str(manifest['sourceCommit'])
          blob_shas = [str(row['gitBlobSha']) for row in manifest['files']]
          historical_pins = [package_version, source_commit, *blob_shas]
          leaked = [value for value in historical_pins if value and value in workflow]
          if leaked:
              raise SystemExit('workflow contains literal manifest metadata pins: ' + ', '.join(leaked[:8]))

          required_dynamic_tokens = [
              'parallel\\OWNER_ONECLICK\\package_manifest.json',
              '$manifest.packageVersion',
              '$manifest.sourceCommit',
              '$f.gitBlobSha',
              '$env:WOF_PACKAGE_VERSION',
              '$env:WOF_SOURCE_COMMIT',
          ]
          missing = [token for token in required_dynamic_tokens if token not in workflow]
          if missing:
              raise SystemExit('workflow lost dynamic manifest contract tokens: ' + ', '.join(missing))

          # Synthetic newer metadata is validated with the same accepted shapes. Because
          # the workflow contains no current manifest literals and consumes these fields
          # dynamically, changing a valid manifest does not require a workflow pin edit.
          future_version = '.'.join(('2099', '12', '31', 'synthetic'))
          future_commit = ''.join(['1'] * 40)
          future_blob = ''.join(['2'] * 40)
          if not re.fullmatch(r'[A-Za-z0-9._-]+', future_version):
              raise SystemExit('synthetic future package version fixture is invalid')
          if not re.fullmatch(r'[0-9a-f]{40}', future_commit) or not re.fullmatch(r'[0-9a-f]{40}', future_blob):
              raise SystemExit('synthetic future SHA fixture is invalid')

  windows-oneclick:
    runs-on: windows-latest
    env:
      WOF_BOOTSTRAP_URL: https://raw.githubusercontent.com/ouyong520/wof-ai-private/${{ github.sha }}/parallel/OWNER_ONECLICK/bootstrap_v2.ps1
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load and validate checkout package manifest contract
        shell: powershell
        run: |
          $manifestPath = Join-Path (Get-Location) 'parallel\OWNER_ONECLICK\package_manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw 'package manifest missing from checkout' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json

          $version = [string]$manifest.packageVersion
          $sourceCommit = ([string]$manifest.sourceCommit).ToLowerInvariant()
          if ($version -notmatch '^[A-Za-z0-9._-]+$') { throw 'manifest packageVersion is invalid' }
          if ($sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'manifest sourceCommit is invalid' }
          $expectedBase = 'https://raw.githubusercontent.com/ouyong520/wof-ai-private/' + $sourceCommit + '/'
          if ([string]$manifest.baseUrl -ne $expectedBase) { throw 'manifest baseUrl does not match sourceCommit' }
          if ([string]$manifest.components.pylaunch.sourceCommit -ne $sourceCommit) { throw 'PYLAUNCH sourceCommit does not match package sourceCommit' }
          if ($manifest.safety.readOnly -ne $true -or [int]$manifest.safety.ramWrites -ne 0 -or $manifest.safety.inputInjection -ne $false) { throw 'manifest safety flags changed' }
          if (-not $manifest.files -or $manifest.files.Count -lt 1) { throw 'manifest has no files' }

          $seen = @{}
          foreach ($f in $manifest.files) {
            $rel = [string]$f.path
            $sha = ([string]$f.gitBlobSha).ToLowerInvariant()
            if (-not $rel -or $rel.Contains('..') -or [IO.Path]::IsPathRooted($rel)) { throw ('manifest contains unsafe path: ' + $rel) }
            if ($sha -notmatch '^[0-9a-f]{40}$') { throw ('manifest contains invalid gitBlobSha: ' + $rel) }
            if ($seen.ContainsKey($rel)) { throw ('manifest contains duplicate path: ' + $rel) }
            $seen[$rel] = $true
          }

          & git cat-file -e ($sourceCommit + '^{commit}')
          if ($LASTEXITCODE -ne 0) { throw ('manifest sourceCommit is not present in checkout history: ' + $sourceCommit) }

          ('WOF_PACKAGE_VERSION=' + $version) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ('WOF_SOURCE_COMMIT=' + $sourceCommit) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fresh install through real Chinese CMD and verify manifest-selected package
        shell: powershell
        run: |
          $cn = [string]([char]0x4E2D) + [char]0x6587
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP ('WOF ' + $cn + ' Fresh Path\Local App Data')
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $entryName = 'WOF_' + [char]0x4E00 + [char]0x952E + [char]0x5DE5 + [char]0x5177 + '.cmd'
          $entry = Join-Path (Get-Location) $entryName
          $cmdLine = 'call "' + $entry + '" --update-only'
          cmd.exe /d /c $cmdLine
          if ($LASTEXITCODE -ne 0) { throw ('fresh install failed: ' + $LASTEXITCODE) }

          $repoManifestPath = Join-Path (Get-Location) 'parallel\OWNER_ONECLICK\package_manifest.json'
          $repoManifest = Get-Content -LiteralPath $repoManifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$repoManifest.packageVersion -ne $env:WOF_PACKAGE_VERSION) { throw 'checkout manifest packageVersion changed inside job' }
          if (([string]$repoManifest.sourceCommit).ToLowerInvariant() -ne $env:WOF_SOURCE_COMMIT) { throw 'checkout manifest sourceCommit changed inside job' }

          $root = Join-Path $env:LOCALAPPDATA 'WOF Future Danger\OwnerTools'
          $current = Join-Path $root 'current.txt'
          if (-not (Test-Path -LiteralPath $current)) { throw 'current.txt missing after fresh install' }
          $version = (Get-Content -LiteralPath $current -Raw).Trim()
          if ($version -ne $env:WOF_PACKAGE_VERSION) { throw ('unexpected installed version: ' + $version + ' expected=' + $env:WOF_PACKAGE_VERSION) }
          $release = Join-Path $root ('releases\' + $version)
          foreach ($p in @(
            'installed.ok',
            'PACKAGE_MANIFEST.json',
            'WOF_TOOLKIT.cmd',
            'parallel\OPTOOLKIT\owner_zh_cn.py',
            'parallel\PYLAUNCH\RUN_WINDOWS_PROOF.cmd',
            'parallel\PYLAUNCH\WOF_ONECLICK_PROOF_CN.cmd',
            'parallel\PYLAUNCH\launcher.py',
            'parallel\PYLAUNCH\wof_launcher\discovery_v2.py',
            'parallel\PYLAUNCH\wof_launcher\monitor.py',
            'parallel\PYLAUNCH\wof_launcher\proof.py',
            'parallel\WOF052L_RECORDER\owner_zh_cn.py',
            'parallel\BROWSER_FLEET\fleet_owner_zh_cn.py'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $release $p))) { throw ('installed file missing: ' + $p) }
          }

          $installedManifest = Get-Content -LiteralPath (Join-Path $release 'PACKAGE_MANIFEST.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$installedManifest.packageVersion -ne [string]$repoManifest.packageVersion) { throw 'installed manifest package version mismatch' }
          if (([string]$installedManifest.sourceCommit).ToLowerInvariant() -ne ([string]$repoManifest.sourceCommit).ToLowerInvariant()) { throw 'installed manifest source commit mismatch' }
          if ([string]$installedManifest.baseUrl -ne [string]$repoManifest.baseUrl) { throw 'installed manifest baseUrl mismatch' }
          if ([string]$installedManifest.components.pylaunch.sourceCommit -ne [string]$repoManifest.components.pylaunch.sourceCommit) { throw 'installed PYLAUNCH source commit mismatch' }
          if ($installedManifest.safety.readOnly -ne $true -or [int]$installedManifest.safety.ramWrites -ne 0 -or $installedManifest.safety.inputInjection -ne $false) { throw 'installed manifest safety flags changed' }

          $expected = @{}
          foreach ($f in $repoManifest.files) { $expected[[string]$f.path] = ([string]$f.gitBlobSha).ToLowerInvariant() }
          $installedExpected = @{}
          foreach ($f in $installedManifest.files) { $installedExpected[[string]$f.path] = ([string]$f.gitBlobSha).ToLowerInvariant() }
          if ($expected.Count -ne $installedExpected.Count) { throw 'installed manifest file count mismatch' }
          foreach ($rel in $expected.Keys) {
            if (-not $installedExpected.ContainsKey($rel)) { throw ('installed manifest missing entry: ' + $rel) }
            if ($installedExpected[$rel] -ne $expected[$rel]) { throw ('installed manifest SHA differs from checkout manifest: ' + $rel) }
            $full = Join-Path $release ($rel -replace '/', '\')
            if (-not (Test-Path -LiteralPath $full)) { throw ('installed manifest file missing: ' + $rel) }
            $actual = (& git hash-object -- $full).Trim().ToLowerInvariant()
            if ($actual -ne $expected[$rel]) { throw ('installed blob mismatch: ' + $rel + ' expected=' + $expected[$rel] + ' actual=' + $actual) }
          }

          $workerReplacement = Get-ChildItem -LiteralPath $release -Recurse -File -Include *.py,*.js,*.mjs,*.cmd,*.bat,*.ps1 -ErrorAction SilentlyContinue |
            Select-String -Pattern '(?i)window\s*\.\s*Worker\s*=' -ErrorAction SilentlyContinue
          if ($workerReplacement) { throw 'forbidden window.Worker replacement pattern found in installed package' }

          if (Get-ChildItem -LiteralPath (Join-Path $root 'releases') -Directory -Filter '*.staging-*') { throw 'staging directory remained after successful fresh install' }

      - name: Smoke-start installed Chinese Windows proof execution path
        shell: powershell
        run: |
          $cn = [string]([char]0x4E2D) + [char]0x6587
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP ('WOF ' + $cn + ' Fresh Path\Local App Data')
          $root = Join-Path $env:LOCALAPPDATA 'WOF Future Danger\OwnerTools'
          $release = Join-Path $root ('releases\' + $env:WOF_PACKAGE_VERSION)
          $pyDir = Join-Path $release 'parallel\PYLAUNCH'
          $launcher = Join-Path $pyDir 'launcher.py'
          $venvPython = Join-Path $root 'venv\Scripts\python.exe'
          $status = Join-Path $pyDir 'WINDOWS_PROOF_STATUS.json'
          if (-not (Test-Path -LiteralPath $venvPython)) { throw 'packaged Python venv missing' }
          Remove-Item -LiteralPath $status -Force -ErrorAction SilentlyContinue
          Push-Location $pyDir
          try {
            & $venvPython $launcher --no-tray --once --attach-only --proof-json $status
            if ($LASTEXITCODE -ne 0) { throw ('installed proof execution failed: ' + $LASTEXITCODE) }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath $status)) { throw 'WINDOWS_PROOF_STATUS.json was not created' }
          $proof = Get-Content -LiteralPath $status -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($proof.readOnly -ne $true -or [int]$proof.ramWrites -ne 0 -or $proof.inputInjection -ne $false) { throw 'proof safety flags changed' }
          if (-not $proof.ownerSummaryZh -or -not $proof.checksZh) { throw 'Chinese proof summary/checks missing' }

      - name: Update from synthetic previous package and preserve last-known-good
        shell: powershell
        run: |
          $cn = [string]([char]0x4E2D) + [char]0x6587
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP ('WOF ' + $cn + ' Upgrade Path\Local App Data')
          $root = Join-Path $env:LOCALAPPDATA 'WOF Future Danger\OwnerTools'
          $previousVersion = 'ci.previous'
          $old = Join-Path $root ('releases\' + $previousVersion)
          New-Item -ItemType Directory -Path $old -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $old 'installed.ok') -Value 'previous package' -Encoding ASCII
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $root 'current.txt') -Value $previousVersion -Encoding ASCII

          $entryName = 'WOF_' + [char]0x4E00 + [char]0x952E + [char]0x5DE5 + [char]0x5177 + '.cmd'
          $entry = Join-Path (Get-Location) $entryName
          $cmdLine = 'call "' + $entry + '" --update-only'
          cmd.exe /d /c $cmdLine
          if ($LASTEXITCODE -ne 0) { throw ('update from previous package failed: ' + $LASTEXITCODE) }

          $version = (Get-Content -LiteralPath (Join-Path $root 'current.txt') -Raw).Trim()
          if ($version -ne $env:WOF_PACKAGE_VERSION) { throw ('update did not switch to manifest version: ' + $version) }
          if (-not (Test-Path -LiteralPath (Join-Path $old 'installed.ok'))) { throw 'last-known-good previous package was removed' }
          $newRelease = Join-Path $root ('releases\' + $env:WOF_PACKAGE_VERSION)
          if (-not (Test-Path -LiteralPath (Join-Path $newRelease 'installed.ok'))) { throw 'new package missing after update' }

          $repoManifest = Get-Content -LiteralPath (Join-Path (Get-Location) 'parallel\OWNER_ONECLICK\package_manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($f in $repoManifest.files) {
            $rel = [string]$f.path
            $expected = ([string]$f.gitBlobSha).ToLowerInvariant()
            $full = Join-Path $newRelease ($rel -replace '/', '\')
            if (-not (Test-Path -LiteralPath $full)) { throw ('updated package file missing: ' + $rel) }
            $actual = (& git hash-object -- $full).Trim().ToLowerInvariant()
            if ($actual -ne $expected) { throw ('updated package blob mismatch: ' + $rel + ' expected=' + $expected + ' actual=' + $actual) }
          }
          if (Get-ChildItem -LiteralPath (Join-Path $root 'releases') -Directory -Filter '*.staging-*') { throw 'staging directory remained after update' }

      - name: Re-run updater without changing immutable current release
        shell: powershell
        run: |
          $cn = [string]([char]0x4E2D) + [char]0x6587
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP ('WOF ' + $cn + ' Upgrade Path\Local App Data')
          $previousVersion = 'ci.previous'
          $entryName = 'WOF_' + [char]0x4E00 + [char]0x952E + [char]0x5DE5 + [char]0x5177 + '.cmd'
          $entry = Join-Path (Get-Location) $entryName
          $cmdLine = 'call "' + $entry + '" --update-only'
          cmd.exe /d /c $cmdLine
          if ($LASTEXITCODE -ne 0) { throw ('second updater run failed: ' + $LASTEXITCODE) }
          $root = Join-Path $env:LOCALAPPDATA 'WOF Future Danger\OwnerTools'
          $version = (Get-Content -LiteralPath (Join-Path $root 'current.txt') -Raw).Trim()
          if ($version -ne $env:WOF_PACKAGE_VERSION) { throw ('version changed unexpectedly: ' + $version) }
          if (-not (Test-Path -LiteralPath (Join-Path $root ('releases\' + $previousVersion + '\installed.ok')))) { throw 'previous last-known-good missing after second run' }
          if (-not (Test-Path -LiteralPath (Join-Path $root ('releases\' + $env:WOF_PACKAGE_VERSION + '\installed.ok')))) { throw 'current immutable release missing after second run' }
