name: Upgrade WOF V4.8.1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/patch_v481.py'
      - '.github/workflows/upgrade-v481.yml'
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime to V4.8.1
        run: |
          python3 tools/patch_v481.py
          node --check wof_v4_install_once.js
          grep -q "offline-dynamic-spectator-calibrated-v4.8.1" wof_v4_install_once.js
          grep -q "WOF V4.8.1 Variant稳定性/真实漏判审计版启动" wof_v4_install_once.js
          grep -q "unstableCovered" wof_v4_install_once.js
          grep -q "variantDemoteConfirmed:2" wof_v4_install_once.js
          grep -q "sourceDemoteConfirmed:6" wof_v4_install_once.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wof_v4_install_once.js
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade WOF V4.8.1 variant stability audit"
          git push
